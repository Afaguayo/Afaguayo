name: snake

# Redraws the contribution-graph snake every 12 hours and pushes it to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb3da&color_dots=#161b22,#333333,#595959,#a6a6a6,#ffffff
            dist/snake-light.svg?color_snake=#ff6fb5&color_dots=#ebedf0,#d9d9d9,#bfbfbf,#8c8c8c,#000000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
